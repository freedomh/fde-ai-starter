name: ${COMPOSE_PROJECT_NAME:?Run Init-Local.ps1 first}
services:
  mysql:
    image: mysql:8.0.42
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run Init-Local.ps1 first}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: app
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command: ["--default-time-zone=+08:00"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -uroot -N -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  redis:
    image: redis:7.2.8
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?serverTimezone=Asia/Shanghai
      DB_USER: app
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${BACKEND_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        APP_DIR: frontend
    ports:
      - "127.0.0.1:${WEB_PORT}:80"
    depends_on: [backend]
  admin:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        APP_DIR: admin
    ports:
      - "127.0.0.1:${ADMIN_PORT}:80"
    depends_on: [backend]
volumes:
  mysql-data:
